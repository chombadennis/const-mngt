# docker-compose.prod.yml (Neon / external DATABASE_URL)
services:
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    ports:
      - "8000:8000"
    depends_on:
      - redis
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: ["npm", "run", "start"]
